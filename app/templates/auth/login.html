{% extends "base.html" %}

{% block title %}Login &bull; CyberSec Toolkit{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">🔐</span>
      <h2 style="font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem;">Auditor Login</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Access your scan history, custom API key, and audit logs</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="auditor or email@domain.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">Remember this session</label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
        Sign In to Toolkit
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an auditor account? <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
