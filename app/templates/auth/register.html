{% extends "base.html" %}

{% block title %}Register &bull; CyberSec Toolkit{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2.5rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2.5rem;">🛡️</span>
      <h2 style="font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem;">Create Auditor Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Track all tool scans, save game badges, and generate API keys</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Auditor Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="sec_analyst" minlength="3" maxlength="30" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work / Personal Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="analyst@domain.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Master Password (min 8 chars)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" minlength="8" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Master Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
        Complete Registration
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
